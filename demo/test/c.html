<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>slice C harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../css/fonts.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/viewer.css">
<link rel="stylesheet" href="../css/settings.css">
</head>
<body>
<div id="window"><div id="main"></div><div id="toast" hidden></div></div>
<script type="module">
// Boots the modules of slice C alone, on a stand-in for the layout and the file store.
import { bus } from "../js/bus.js";
import { register } from "../js/state.js";
import { startConfig } from "../js/config.js";
import { installKeys } from "../js/keymap.js";
import { installTestContract } from "../js/test-contract.js";
import { toast } from "../js/toast.js";
import { startViewer, createViewerPane } from "../js/viewer.js";
import { startSettings } from "../js/settings.js";
import { startEffects } from "../js/settings-effects.js";
import { viewerKeys } from "../js/keys/viewer.js";
import { helpKeys } from "../js/keys/help.js";
import { fs, files, ROOT } from "./c-fs.js";

// Rows of the other slices that Help would list.
const fixture = [
  { id: "t.close", chords: ["Cmd+Alt+W"], when: "any", group: "Tabs and windows", text: "Close the tab", cmd: "noop" },
  { id: "t.new", chords: ["Cmd+T"], alt: ["Ctrl+Alt+T"], when: "any", group: "Tabs and windows", text: "New tab", cmd: "noop" },
];
const rows = [...fixture, ...viewerKeys, ...helpKeys];

register("workspaces", {});
startConfig();
startEffects();
startViewer({ fs, home: "/home/demo", root: ROOT });
startSettings(rows);
installKeys(rows, { focus: () => (document.activeElement?.tagName === "IFRAME" ? "viewer" : "terminal") });
installTestContract();
bus.on("toast", ({ text }) => toast(text));

const splits = [];
const panes = new Map();
const main = document.getElementById("main");
const add = (id) => { const pane = createViewerPane(id); panes.set(id, pane); main.append(pane.el); };

bus.handle("noop", () => {});
bus.handle("pane.split", (p) => splits.push(p));
bus.handle("pane.close", ({ id }) => { panes.get(id)?.dispose(); panes.delete(id); });
bus.handle("vfs.write", ({ path, text, by }) => { files.set(path, text); bus.emit("vfs:changed", { path, by }); });
bus.on("viewer:needed", (request) => { add("v1"); bus.cmd("viewer.open", { ...request, pane: "v1" }); });

window.__c = { bus, files, ROOT, splits, add, paneCount: () => panes.size };
document.documentElement.dataset.ready = "true";
</script>
</body>
</html>
