# tarn CI: `make -f tarn.mk check` on macOS and the browser demo checks on Linux.
# dev gets the demo checks only, nothing waits on them; main (release PRs from dev) gets both jobs.
# Upstream workflows stay in this folder for clean upstream merges and are disabled in the settings.
name: tarn-ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_call:
    inputs:
      upstream:
        description: Merge upstream/main into the checkout first (tarn-upstream).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tarn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.upstream && '0' || '1' }}
          persist-credentials: false
      - name: Merge upstream/main
        if: inputs.upstream
        run: |
          git -c user.name=ci -c user.email=ci@localhost fetch --quiet https://github.com/ghostty-org/ghostty.git main
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Demo unit tests
        # File arguments: the runner's Node 22 does not take a folder.
        run: node --test demo/test/unit/*.test.mjs
      - name: Demo checks
        run: |
          for c in 0 a b c e2e review modules; do
            uv run -q --with playwright python -I demo/test/check_$c.py
          done

  app:
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || inputs.upstream
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # A hung app costs hook.sh 166-404 ms on these runners; 800 ms still catches a wait on nc's
      # 1 s timeout. The 100 ms contract is checked on the Mac.
      TARN_HOOK_LIMIT_MS: "800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.upstream && '0' || '1' }}
          persist-credentials: false
      - name: Merge upstream/main
        if: inputs.upstream
        run: |
          git -c user.name=ci -c user.email=ci@localhost fetch --quiet https://github.com/ghostty-org/ghostty.git main
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      # The version comes from minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Linters
        run: brew install swiftlint shellcheck
      - name: Build GhosttyKit
        run: zig build -Demit-macos-app=false
      - name: make -f tarn.mk check
        run: make -f tarn.mk check
      - name: Test log
        if: failure()
        run: tail -200 macos/build/test.log || true
