# tarn CI: `make -f tarn.mk check` on macOS and the browser demo checks on Linux.
# GitHub flow (T-428): `demo`, `lint`, `app` and `secrets` run on every PR and push to main; `gate` is
# red unless all of them succeeded and is the one required check (T-450: agents merge unattended, so
# Swift is built and tested before a merge, not after).
# A release tag goes only on a commit with green `app`.
# Upstream workflows stay in this folder for clean upstream merges and are disabled in the settings.
name: tarn-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      upstream:
        description: Merge upstream/main into the checkout first (tarn-upstream).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer push to a PR replaces its old run. A push to main gets a group of its own (the
  # commit), so a queued run is never dropped for a newer one.
  group: tarn-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.upstream && '0' || '1' }}
          persist-credentials: false
      - name: Merge upstream/main
        if: inputs.upstream
        run: |
          git -c user.name=ci -c user.email=ci@localhost fetch --quiet https://github.com/ghostty-org/ghostty.git main
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Demo unit tests
        # File arguments: the runner's Node 22 does not take a folder.
        run: node --test demo/test/unit/*.test.mjs
      - name: Install browser
        run: uv run -q --with playwright python -m playwright install --with-deps chromium-headless-shell
      - name: Viewer clipboard
        run: uv run -q --with playwright python -I viewer-web/test-clipboard.py
      - name: Demo checks
        run: |
          # A check script that fails gets one more run, and the retry is written to the job summary,
          # so a flaky check shows up even when the second run passes; a real defect fails both.
          for c in 0 a b c e2e review modules; do
            uv run -q --with playwright python -I demo/test/check_$c.py && continue
            echo "- check_$c failed once and was retried" >> "$GITHUB_STEP_SUMMARY"
            uv run -q --with playwright python -I demo/test/check_$c.py
          done

  lint:
    # What of `make -f tarn.mk check` needs no macOS: runs on every PR in about 20 s. Swiftlint,
    # the app tests and the installer test (plutil, ditto) stay on macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Shared runners stall a stale-socket connect past 100 ms; the contract is checked on the Mac.
      TARN_HOOK_LIMIT_MS: "800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.upstream && '0' || '1' }}
          persist-credentials: false
      - name: Merge upstream/main
        if: inputs.upstream
        run: |
          git -c user.name=ci -c user.email=ci@localhost fetch --quiet https://github.com/ghostty-org/ghostty.git main
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Shell lint
        run: shellcheck -e SC2015 plugin/hooks/*.sh install.sh cli/tarn cli/test/install_test.sh tools/stand/stand.sh tools/stand/drive.sh
      - name: Spelling
        run: |
          uvx typos@1.51.1 --exclude 'macos/Sources/Features/Tarn/Viewer/tarn-*' cli plugin tools docs demo viewer-web \
            macos/Sources/Features/Tarn macos/Tests/Tarn install.sh README.md NOTICE.md tarn.mk .github/workflows/tarn-*.yml
      - name: Python lint
        run: |
          uvx ruff@0.17.2 check plugin/test
          uvx ruff@0.17.2 format --check plugin/test
      - name: Script tests
        run: |
          python3 -I plugin/test/hook_test.py
          python3 -I cli/test/cli_test.py

  app:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # A hung app costs hook.sh up to 404 ms on these runners (T-182 measured the old loop);
      # 800 ms still catches a wait on nc's 1 s timeout. The 100 ms contract is checked on the Mac.
      TARN_HOOK_LIMIT_MS: "800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.upstream && '0' || '1' }}
          persist-credentials: false
      - name: Merge upstream/main
        if: inputs.upstream
        run: |
          git -c user.name=ci -c user.email=ci@localhost fetch --quiet https://github.com/ghostty-org/ghostty.git main
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit FETCH_HEAD
      # The version comes from minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Linters
        run: brew install swiftlint shellcheck typos-cli uv
      - name: Build GhosttyKit
        run: zig build -Demit-macos-app=false
      - name: make -f tarn.mk check
        run: make -f tarn.mk check
      - name: Test log
        if: failure()
        run: |
          grep -n -B2 -A6 -E "✘|Expectation|recorded an issue" macos/build/test.log | head -120 || true
          tail -200 macos/build/test.log || true

  # Secrets in what the PR would merge: gitleaks over the tree, upstream false positives in .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --no-banner --redact --config .gitleaks.toml .

  gate:
    if: always()
    needs: [demo, lint, app, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success) ;; *) exit 1 ;; esac
          done
