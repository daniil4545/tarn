# A tag tarn-v<version> builds the ad-hoc signed zip and its sha256 with `make -f tarn.mk release`
# and attaches them to the GitHub Release of the tag; a missing release is created as a draft,
# its notes are written by hand.
name: tarn-release

on:
  push:
    tags: ["tarn-v*"]
    branches: [ci-probe]

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: make -f tarn.mk release
        run: make -f tarn.mk release
      - name: The tag names the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(plutil -extract CFBundleShortVersionString raw macos/build/ReleaseLocal/Tarn.app/Contents/Info.plist)
          test "tarn-v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, app version $v"; exit 1; }
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag --notes ""
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/tarn-*-macos.zip dist/tarn-*-macos.zip.sha256
